<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Nazor</title>
    <base href="/" />
    <script>
        // GitHub Pages serves this file for unknown paths. Keep the requested route and reopen the app at its base address.
        (function () {
            var base = new URL(document.baseURI).pathname;
            if (location.pathname === base) return;
            try { sessionStorage.setItem('nazor-redirect', location.pathname + location.search + location.hash); } catch (e) { }
            location.replace(base);
        })();
    </script>
</head>
<body></body>
</html>
