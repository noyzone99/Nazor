name: Website

on:
  push:
    branches: [main, dev]
    paths:
      - "Docs/**"
      - "Webpage/**"
      - "Sources/Themes/Nazor.Themes.NazorLeaf/Fonts/**"
      - "Directory.Build.props"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Configure GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: pages
        uses: actions/configure-pages@v5

      - name: Build and verify static site
        env:
          PAGES_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          dotnet publish Webpage/Nazor.Website/Nazor.Website.csproj -c Release -o publish "-p:SitePublicUrl=$PAGES_URL"
          python3 Webpage/verify-publish.py publish/wwwroot "$PAGES_URL"

      - name: Prepare for GitHub Pages
        if: steps.pages.outcome == 'success'
        run: find publish/wwwroot -type f \( -name '*.br' -o -name '*.gz' \) -delete

      - uses: actions/upload-pages-artifact@v4
        if: steps.pages.outcome == 'success'
        with:
          path: publish/wwwroot

      - uses: actions/upload-artifact@v7
        if: steps.pages.outcome == 'skipped'
        with:
          name: website
          path: publish/wwwroot
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
