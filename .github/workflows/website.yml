name: Website

on:
  push:
    branches: [main, dev]
    paths:
      - "Docs/**"
      - "Webpage/**"
      - "Sources/Themes/Nazor.Themes.NazorLeaf/Fonts/**"
      - "Directory.Build.props"
      - "global.json"
      - "nuget.config"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json

      - name: Build static site
        run: dotnet publish Webpage/Nazor.Website/Nazor.Website.csproj -c Release -o publish

      - name: Verify published documentation
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          site = Path("publish/wwwroot")
          manifest = json.loads((site / "content/manifest.json").read_text(encoding="utf-8"))
          pages = manifest["pages"]
          expected = {"Docs/README.md", "Docs/Guide/README.md", "Docs/API.md"}
          expected.update(path.as_posix() for path in Path("Docs/Guide").glob("[0-9][0-9]-*.md"))
          expected.update(path.as_posix() for path in Path("Docs/ApiReferences").glob("*.md"))
          missing = expected - {page["source"] for page in pages}
          if missing:
              raise SystemExit("Missing documentation sources: " + ", ".join(sorted(missing)))

          for asset in ["index.html", "404.html", "_framework/blazor.webassembly.js",
                        "content/fonts/Geist.ttf", "content/fonts/GeistMono.ttf",
                        "content/fonts/BricolageGrotesque.ttf", *(page["content"] for page in pages)]:
              file = site / asset
              if not file.is_file() or not file.stat().st_size:
                  raise SystemExit(f"Missing or empty published asset: {asset}")
          print(f"Verified {len(pages)} documentation pages in {site}")
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: website
          path: publish/wwwroot
          include-hidden-files: true
          if-no-files-found: error
