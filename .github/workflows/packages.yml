name: Packages

on:
  push:
    branches: [main, dev]
    tags: ['**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  version:
    name: Validate tagged release version
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.tag.outputs.release }}
      vsix: ${{ steps.tag.outputs.vsix }}
    steps:
      - uses: actions/checkout@v6
        if: github.ref_type == 'tag' && !github.event.deleted
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            Directory.Build.props
            Sources/Tools/Nazor.VisualStudio/source.extension.vsixmanifest

      - name: Check release and VSIX versions
        id: tag
        if: github.ref_type == 'tag' && !github.event.deleted
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -cnotmatch '^v?(?<release>(?<vsix>[0-9]+\.[0-9]+\.[0-9]+)(?:-[0-9A-Za-z-]+(?:\.[0-9A-Za-z-]+)*)?)$') {
            Write-Host "Tag '$tag' only builds the portable Gallery."
            exit 0
          }
          $release = $Matches.release
          $vsix = $Matches.vsix
          $version = (Select-Xml -LiteralPath Directory.Build.props -XPath '//NazorVersion').Node.InnerText
          [xml]$manifest = Get-Content Sources/Tools/Nazor.VisualStudio/source.extension.vsixmanifest -Raw
          $extensionVersion = $manifest.PackageManifest.Metadata.Identity.Version
          if ($release -cne $version) { throw "Tag '$tag' does not match NazorVersion '$version'." }
          if ($vsix -cne $extensionVersion) { throw "Tag '$tag' requires VSIX version '$vsix', but the manifest uses '$extensionVersion'." }
          "release=$release", "vsix=$vsix" >> $env:GITHUB_OUTPUT

  native:
    if: '!github.event.deleted'
    name: Native libraries (${{ matrix.rid }})
    needs: version
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: linux-x64
            os: ubuntu-24.04
          - rid: linux-musl-x64
            os: ubuntu-24.04
          - rid: linux-arm64
            os: ubuntu-24.04-arm
          - rid: linux-musl-arm64
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build and test the native libraries
        env:
          NATIVE_RID: ${{ matrix.rid }}
        run: bash Scripts/Build/build-native-matrix.sh Release "$NATIVE_RID"

      - uses: actions/upload-artifact@v7
        with:
          name: native-${{ matrix.rid }}
          path: artifacts/native/${{ matrix.rid }}/
          if-no-files-found: error

  package:
    name: Build NuGet packages and Gallery
    needs: [version, native]
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100

      - uses: actions/download-artifact@v8
        with:
          pattern: native-*
          path: artifacts/native-download

      - name: Stage native libraries
        shell: pwsh
        run: |
          foreach ($rid in 'linux-x64', 'linux-musl-x64', 'linux-arm64', 'linux-musl-arm64') {
            $target = "artifacts/native/$rid"
            New-Item -ItemType Directory -Force $target | Out-Null
            Copy-Item "artifacts/native-download/native-$rid/libnazor-wayland.so" $target
            Copy-Item "artifacts/native-download/native-$rid/libnazor-x11.so" $target
          }

      - name: Pack NuGet packages
        if: github.ref_type != 'tag' || needs.version.outputs.release != ''
        shell: pwsh
        run: ./Scripts/Packaging/pack.ps1 -Symbols

      - name: Verify the release packages and tutorial
        if: needs.version.outputs.release != ''
        shell: pwsh
        run: |
          dotnet run --project Scripts/Tests/Documentation -c Release -- . artifacts/packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./Scripts/Tests/verify-doc-tutorial.ps1 -Feed artifacts/packages

      - uses: actions/upload-artifact@v7
        if: github.ref_type != 'tag' || needs.version.outputs.release != ''
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error

      - name: Pack the portable Gallery
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $publish = 'artifacts/gallery-release/publish'
          dotnet publish Samples/Nazor.Samples.Gallery -c Release --self-contained false -p:UseAppHost=false -p:NazorEnableDevTools=false -p:NazorSkipNativeBuild=true -p:UseSharedCompilation=false -m:1 -o $publish
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($file in 'Nazor.Samples.Gallery.dll', 'Nazor.Samples.Gallery.runtimeconfig.json', 'runtimes/win-x64/native/libSkiaSharp.dll') {
            if (-not (Test-Path -LiteralPath "$publish/$file" -PathType Leaf)) { throw "Missing Gallery file: $file" }
          }
          Copy-Item LICENSE "$publish/Nazor.LICENSE.txt"
          Compress-Archive -Path "$publish/*" -DestinationPath artifacts/gallery-release/Nazor.Gallery-portable.zip

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: gallery-portable
          path: artifacts/gallery-release/Nazor.Gallery-portable.zip
          if-no-files-found: error

  release:
    name: Attach Gallery to the GitHub Release
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: gallery-portable
          path: artifacts/gallery-release

      - name: Publish the Gallery asset
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          asset=artifacts/gallery-release/Nazor.Gallery-portable.zip
          test -s "$asset"
          if assets=$(gh release view --json assets --jq '.assets[] | select(.state == "uploaded" and .size > 0) | .name' -- "$RELEASE_TAG"); then
            if ! grep -Fxq -- "${asset##*/}" <<< "$assets"; then
              gh release upload -- "$RELEASE_TAG" "$asset"
            fi
          else
            options=()
            if [[ "$RELEASE_TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+-[0-9A-Za-z-] ]]; then
              options+=(--prerelease)
            fi
            notes='Download `Nazor.Gallery-portable.zip` from Assets and extract it. With the .NET 10 Runtime installed, run `dotnet Nazor.Samples.Gallery.dll` from the extracted folder on Windows x64 or a supported Linux x64/ARM64 system.'
            gh release create --verify-tag --title "$RELEASE_TAG" --notes "$notes" "${options[@]}" -- "$RELEASE_TAG" "$asset"
          fi

  editors:
    name: Editor extensions
    if: ${{ !github.event.deleted && (github.ref_type != 'tag' || needs.version.outputs.release != '') }}
    needs: version
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: 11.0.100

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Build and verify editor extensions
        shell: pwsh
        run: |
          ./Scripts/Build/build-editors.ps1
          if (-not (Test-Path artifacts/editors/visualstudio/Nazor.VisualStudio.vsix)) {
            throw 'The Visual Studio VSIX is missing. Check the Visual Studio extension development workload.'
          }

      - name: Package the VS Code extension
        working-directory: artifacts/editors/vscode/nazor
        shell: pwsh
        run: |
          npx --yes @vscode/vsce@4.0.0 package --allow-missing-repository --out ../../Nazor.VSCode.vsix
          if ($LASTEXITCODE -ne 0) { throw 'VS Code packaging failed.' }
          $archive = [IO.Compression.ZipFile]::OpenRead((Resolve-Path ../../Nazor.VSCode.vsix).Path)
          try {
            foreach ($file in 'package.json', 'extension.js', 'server/Nazor.LanguageServer.dll', 'node_modules/vscode-languageclient/package.json') {
              if (-not $archive.GetEntry("extension/$file")) { throw "Missing VS Code package file: $file" }
            }
          }
          finally { $archive.Dispose() }

      - name: Archive the TextMate bundle
        shell: pwsh
        run: Compress-Archive artifacts/editors/visualstudio-folder/Nazor artifacts/editors/Nazor.TextMate.zip

      - uses: actions/upload-artifact@v7
        with:
          name: editor-extensions
          path: |
            artifacts/editors/visualstudio/Nazor.VisualStudio.vsix
            artifacts/editors/Nazor.VSCode.vsix
            artifacts/editors/Nazor.TextMate.zip
          if-no-files-found: error

  publish-nuget:
    name: Publish to NuGet.org
    if: github.event_name == 'push' && github.ref_type == 'tag' && github.event.created && needs.version.outputs.release != ''
    needs: [version, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: nuget-release
    permissions:
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@v8
        with:
          name: nuget-packages
          path: artifacts/packages

      - name: Authenticate to NuGet.org
        id: nuget
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || 'berik-99' }}

      - name: Publish NuGet packages and symbols
        shell: bash
        env:
          NUGET_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
          NUGET_SYMBOL_API_KEY: ${{ steps.nuget.outputs.NUGET_API_KEY }}
        run: |
          shopt -s failglob
          source=https://api.nuget.org/v3/index.json
          for package in artifacts/packages/*.nupkg; do
            dotnet nuget push "$package" --source "$source" --skip-duplicate --no-symbols
          done
          for symbols in artifacts/packages/*.snupkg; do
            dotnet nuget push "$symbols" --source "$source" --skip-duplicate
          done

  publish-visual-studio:
    name: Publish to Visual Studio Marketplace
    needs: [version, editors, publish-nuget]
    runs-on: windows-2025-vs2026
    timeout-minutes: 15
    concurrency:
      group: marketplace-${{ needs.version.outputs.vsix }}
    environment: marketplace-release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          sparse-checkout: Sources/Tools/Nazor.VisualStudio

      - uses: actions/download-artifact@v8
        with:
          name: editor-extensions
          path: artifacts/editors

      - name: Publish the Visual Studio VSIX
        working-directory: Sources/Tools/Nazor.VisualStudio
        shell: pwsh
        env:
          VSIX_FILE: ${{ github.workspace }}/artifacts/editors/visualstudio/Nazor.VisualStudio.vsix
          VSIX_VERSION: ${{ needs.version.outputs.vsix }}
        run: |
          $uri = "https://marketplace.visualstudio.com/_apis/public/gallery/publishers/Noyzone99/vsextensions/nazorvisualstudio/$env:VSIX_VERSION/vspackage"
          $status = & curl.exe --silent --show-error --output NUL --write-out '%{http_code}' --range 0-0 --max-time 15 --retry 2 $uri
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status -in '200', '206', '302') {
            Write-Host "VSIX version $env:VSIX_VERSION is already published."
            exit 0
          }
          if ($status -ne '404') { throw "Marketplace version check returned HTTP $status." }

          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $publisher = & $vswhere -latest -requires Microsoft.VisualStudio.Workload.VisualStudioExtension -find 'VSSDK/VisualStudioIntegration/Tools/Bin/VsixPublisher.exe' | Select-Object -First 1
          if (-not $publisher) { throw 'VsixPublisher.exe was not found on the runner.' }
          & $publisher publish -payload $env:VSIX_FILE -publishManifest publishManifest.json -oidc
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
