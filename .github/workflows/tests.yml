name: Tests

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, ubuntu-24.04-arm]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: global.json
          dotnet-version: |
            8.0.x
            9.0.x
            11.0.100

      - name: Install Linux test dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config libwayland-dev libwayland-bin libxkbcommon-dev \
            libx11-dev libxcursor-dev libxrender-dev libxext-dev libxrandr-dev \
            libfontconfig1 fonts-dejavu-core xkb-data dbus-daemon \
            weston xwayland xvfb openbox xcompmgr x11-utils

      - name: Build and test the Linux native bridges
        if: runner.os == 'Linux'
        run: |
          bash Scripts/Build/build-native.sh Release
          echo "LD_LIBRARY_PATH=$PWD/artifacts/native/linux-${RUNNER_ARCH,,}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

      - name: Build the solution
        id: build
        shell: pwsh
        run: dotnet build Nazor.slnx -c Release -m:1 -p:UseSharedCompilation=false -p:NazorSkipNativeBuild=true

      - name: Run managed suites
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts/ci-tests | Out-Null
          $suites = @(
            'Core', 'Style', 'Layout', 'Compiler', 'Controls', 'Rendering', 'Diagnostics',
            'DevTools.Agent', 'DevTools', 'Tooling', 'LanguageServer'
          )
          if ($IsWindows) { $suites += 'Application' }
          $failed = @(foreach ($suite in $suites) {
            $project = "Nazor.$suite.Tests"
            & dotnet "Tests/$project/bin/Release/net10.0/$project.dll" -noLogo -noColor -result-xml "artifacts/ci-tests/$project.xml" | Out-Host
            if ($LASTEXITCODE -ne 0) { $project }
          })
          foreach ($framework in 'net8.0', 'net9.0', 'net10.0') {
            & dotnet "Tests/Nazor.DevTools.Protocol.Tests/bin/Release/$framework/Nazor.DevTools.Protocol.Tests.dll" -noLogo -noColor -result-xml "artifacts/ci-tests/protocol-$framework.xml"
            if ($LASTEXITCODE -ne 0) { $failed += "DevTools.Protocol ($framework)" }
          }
          if ($failed) { throw "Failed suites: $($failed -join ', ')" }

      - name: Run Wayland tests
        if: runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success'
        run: bash Scripts/Tests/verify-linux-desktop.sh wayland Tests/Nazor.Linux.Tests/bin/Release/net10.0/Nazor.Linux.Tests.dll

      - name: Run X11 tests
        if: runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success'
        run: |
          managed=Tests/Nazor.Linux.Tests/bin/Release/net10.0/Nazor.Linux.Tests.dll
          bash Scripts/Tests/verify-linux-desktop.sh x11 "$managed"
          NAZOR_TEST_X11_COMPOSITING=1 NAZOR_DESKTOP_TEST_OUTPUT="$PWD/artifacts/linux-desktop-tests/composited" \
            bash Scripts/Tests/verify-linux-desktop.sh x11 "$managed"

      - name: Run Xwayland tests
        if: runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success'
        run: bash Scripts/Tests/verify-linux-desktop.sh xwayland Tests/Nazor.Linux.Tests/bin/Release/net10.0/Nazor.Linux.Tests.dll

      - name: Run DRM fixture tests
        if: runner.os == 'Linux' && !cancelled() && steps.build.outcome == 'success'
        run: bash Scripts/Tests/verify-drm.sh Release Tests/Nazor.Linux.Tests/bin/Release/net10.0/Nazor.Linux.Tests.dll

      - uses: actions/upload-artifact@v7
        if: '!cancelled()'
        with:
          name: test-results-${{ matrix.os }}
          path: |
            artifacts/ci-tests/*.xml
            artifacts/linux-desktop-tests/
            artifacts/drm-tests/*.xml
            artifacts/native/*/native-tests.txt
